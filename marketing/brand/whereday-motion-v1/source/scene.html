<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whereday · A day, drawn together</title>
<style>
  :root { color-scheme: light; background: #f8f5eb; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  svg { display: block; width: 100%; height: 100%; }
</style>
<svg id="scene" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">A day, drawn together</title>
  <desc id="desc">An indigo pen drawing of a folded city map on ivory paper. A rust route connects three visits: home, a café, and a lookout.</desc>
  <defs>
    <linearGradient id="edge-fade"><stop offset="0" stop-color="black"/><stop offset=".02" stop-color="white"/><stop offset=".98" stop-color="white"/><stop offset="1" stop-color="black"/></linearGradient>
    <mask id="soft-paper-edge"><rect width="1536" height="1024" fill="url(#edge-fade)"/></mask>
    <filter id="pin-shadow" x="-70%" y="-50%" width="240%" height="230%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#203557" flood-opacity=".14"/>
    </filter>
    <g id="home" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-10 0 0-9 10 0M-7-2V9H7V-2M-2 9V3H2V9"/>
    </g>
    <g id="cafe" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-9-3H6V3Q6 9-1.5 9T-9 3ZM6-2H9Q14-2 12 3Q11 5 6 5M-11 12H10M-5-12Q-8-9-5-7M1-12Q-2-9 1-7"/>
    </g>
    <g id="lookout" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="m-13 8 9-14L5 8M-1 8 7-4 15 8M-7 0-4 2-1 0M-15 11H16"/>
    </g>
    <g id="marker" filter="url(#pin-shadow)">
      <path d="M0 0C-5-13-29-29-29-49A29 29 0 0 1 29-49C29-29 5-13 0 0Z" fill="#a95138" stroke="#f8f5eb" stroke-width="2.5"/>
      <circle cy="-49" r="20.5" fill="#f8f5eb"/>
    </g>
  </defs>
  <rect id="paper" width="2000" height="1400" fill="#f8f5eb"/>
  <g id="composition">
    <image id="art" href="../art/folded-city-map.png" width="1536" height="1024"/>
    <g id="journey" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path id="route-bed" stroke="#f8f5eb" stroke-width="10" opacity=".86"/>
      <path id="route" stroke="#a95138" stroke-width="4.2"/>
      <g id="breadcrumbs" fill="#a95138" stroke="#f8f5eb" stroke-width="1.7"></g>
      <g id="visits"></g>
      <g id="traveler">
        <circle id="traveler-halo" r="18" fill="#a95138" stroke="none" opacity=".10"/>
        <circle r="7" fill="#a95138" stroke="#f8f5eb" stroke-width="3"/>
        <circle r="2" fill="#f8f5eb" stroke="none"/>
      </g>
    </g>
  </g>
</svg>
<script type="module" src="scene.mjs"></script>
</html>
