# Disposable mapQa only, idle and onboarded, English API35. Foreground location pregranted, notifications denied.
# Side effects: replays Page One (no place named, nightly page off because notifications are denied), starts one
# recording in the QA package, then stops it; only QA history may be created.
requires:
  platform: android
steps:
- echo: Disposable mapQa, idle/onboarded, English API35. Foreground location pregranted, notifications denied. Replay setup, choose immediate
    recording explicitly, require acknowledged active Map status, then stop; only QA history may be created.
- launch: com.bontecou.whereday.mapqa
- await:
    visible:
      text: Start recording
- await:
    idle: true
- tap:
    id: navigation-archive
- tap:
    id: archive-settings
- await:
    visible:
      id: settings-screen
- await:
    idle: true
- scroll-to:
    target:
      text: Replay onboarding
- tool: button
  args:
    button: home
- tool: launch-app
  args:
    bundleId: com.bontecou.whereday.mapqa
- await:
    visible:
      text: Replay onboarding
- tap:
    text: Replay onboarding
- await:
    visible:
      id: onboarding-cover-dial
- await:
    idle: true
- scroll-to:
    target:
      id: onboarding-continue
- tap:
    id: onboarding-continue
- await:
    visible:
      id: onboarding-intent-days
- await:
    idle: true
- scroll-to:
    target:
      id: onboarding-continue
- tap:
    id: onboarding-continue
- tool: button
  args:
    button: home
- tool: launch-app
  args:
    bundleId: com.bontecou.whereday.mapqa
- await:
    visible:
      id: onboarding-scrub
- await:
    idle: true
- scroll-to:
    target:
      id: onboarding-continue
- tap:
    id: onboarding-continue
- await:
    visible:
      id: onboarding-pen-preview
- await:
    idle: true
- scroll-to:
    target:
      id: onboarding-continue
- tap:
    id: onboarding-continue
- tool: button
  args:
    button: home
- tool: launch-app
  args:
    bundleId: com.bontecou.whereday.mapqa
- echo: Location is pregranted, so the location step shows Continue and the stamp step takes one current fix.
- await:
    visible:
      id: onboarding-perm-compare
- await:
    idle: true
- scroll-to:
    target:
      id: onboarding-continue
- tap:
    id: onboarding-continue
- await:
    visible:
      id: onboarding-stamp-map
- await:
    idle: true
- scroll-to:
    target:
      id: onboarding-continue
- tap:
    id: onboarding-continue
- tool: button
  args:
    button: home
- tool: launch-app
  args:
    bundleId: com.bontecou.whereday.mapqa
- await:
    visible:
      id: onboarding-heatmap
- await:
    idle: true
- scroll-to:
    target:
      id: onboarding-continue
- tap:
    id: onboarding-continue
- echo: Notifications are denied, so the glance step offers Not now; take it.
- await:
    visible:
      id: onboarding-glance-notification
- await:
    idle: true
- scroll-to:
    target:
      id: onboarding-skip
- tap:
    id: onboarding-skip
- await:
    visible:
      id: onboarding-export-preview
- await:
    idle: true
- scroll-to:
    target:
      id: onboarding-skip
- tap:
    id: onboarding-skip
- tool: button
  args:
    button: home
- tool: launch-app
  args:
    bundleId: com.bontecou.whereday.mapqa
- await:
    visible:
      id: onboarding-draft
- await:
    idle: true
- await:
    visible:
      id: onboarding-start-now
- scroll-to:
    target:
      id: onboarding-start-now
- tap:
    id: onboarding-start-now
- tool: button
  args:
    button: home
- tool: launch-app
  args:
    bundleId: com.bontecou.whereday.mapqa
- await:
    visible:
      text: Start my day
- scroll-to:
    target:
      id: onboarding-continue
- tap:
    id: onboarding-continue
- echo: Recording must be acknowledged on the Map (recording status and Stop control), then stop it.
- await:
    visible:
      id: recording-stop
    timeout: 18000
- await:
    idle: true
- await:
    text:
      in:
        id: map-recording-status
      contains: RECORDING
- tap:
    id: recording-stop
- await:
    visible:
      id: recording-start
- await:
    idle: true
