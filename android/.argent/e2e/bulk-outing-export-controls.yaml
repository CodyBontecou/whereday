# Archive bulk Outings export controls on the disposable QA package com.bontecou.whereday.mapqa (NEVER the owner's
# com.bontecou.whereday), in a build with UNCONFIGURED Play billing.
# Prerequisites: mapQa onboarded, idle (not recording), English UI, Archive on defaults (JSON, All, all in one file,
# no additional formats, no export folder), inferred outings on, and exactly one outing in history: the public
# replay-route.csv fixture imported once (see outing-export-access.yaml for staging).
# Side effects (mapQa only): switches Data to Outings, renders a preview, prepares export files in mapQa's cache for
# the share sheet twice (dismissed with Back, nothing shared), opens and cancels the Save picker (no file written),
# turns on One file per outing and the extra CSV format, relaunches to prove they persisted, then restores every
# choice (split off, CSV off, Data All) and ends on the Map.
# 2026-11-24 re-recorded live (argent 0.34.0) for PR #177: unconfigured builds unlock exports, so the old "Verified
# lifetime export access is required." denials on Share/Save became the system share sheet and Save picker. The
# persistence check after relaunch is now executable: Share export carries 2 files ("Sharing 2 files", the per-outing
# JSON plus the extra CSV). With the split on, Save export as… is disabled, so that path is only exercised before it.
# Retargeted from the owner package to mapQa.
# KNOWN APP COPY ISSUE (reported, not asserted): with Data = Outings and the split on, the Archive recipe sentence
# reads "Export my outings as JSON, one file per day." although the toggle is "One file per outing"; this test checks
# only "Export my outings as JSON".
# Raw `button: back` steps dismiss system UI (share sheet, DocumentsUI), each followed by a hidden check.
# Coordinate exceptions: none in the final YAML. Live, the All menu item was recorded role-only (stale pre-tap
# tree); it is replaced by its fixed text ^All$, the element under that point.
# The live devtools tree went stale after every screen change; it was refreshed with
# `adb shell am force-stop com.argent.androiddevtools` before each recorded step (not part of the test).
version: 1
requires:
  platform: android
steps:
  - echo: Disposable mapQa only (never com.bontecou.whereday), unconfigured billing. Requires one outing (the replay fixture) and Archive defaults.
  - launch: com.bontecou.whereday.mapqa
  - await: { visible: { id: map-header-title }, timeout: 20000 }
  - await: { idle: true }
  - tap: { id: navigation-archive }
  - await: { visible: { id: export-history-count } }
  - await: { idle: true }
  - echo: Switch Data from All to Outings; the recipe reads "Export my outings as JSON, all in one file."
  - tap: { text: { matches: '^All$' } }
  - await: { visible: { text: { matches: '^Outings$' } } }
  - tap: { text: { matches: '^Outings$' } }
  - await: { visible: { text: 'Export my outings as JSON, all in one file.' } }
  - echo: Preview the outings export; expect exactly one outing.
  - tap: { id: export-preview-start }
  - scroll-to: { target: { id: export-preview-result }, direction: down }
  - await: { text: { in: { id: export-preview-result }, contains: '"totalOutings": 1' } }
  - echo: 'Outings export is unlocked: Share export opens the Android share sheet (dismissed with Back, nothing shared).'
  - tap: { id: export-share }
  - await: { visible: { id: 'com.android.intentresolver:id/content_preview_filename' }, timeout: 15000 }
  - await: { text: { in: { id: 'com.android.intentresolver:id/content_preview_filename' }, contains: outings.json } }
  - tool: button
    args:
      button: back
  - await: { hidden: { id: 'com.android.intentresolver:id/content_preview_filename' } }
  - await: { visible: { id: export-save-as } }
  - echo: Save export as… opens the system Save picker; cancel it with Back so no file is written.
  - tap: { id: export-save-as }
  - await: { visible: { id: 'com.google.android.documentsui:id/drawer_layout' }, timeout: 15000 }
  - tool: button
    args:
      button: back
  - await: { hidden: { id: 'com.google.android.documentsui:id/drawer_layout' } }
  - echo: Open Filters and fields; turn on One file per outing and the extra CSV format.
  - scroll-to: { target: { id: export-advanced }, direction: down }
  - tap: { id: export-advanced }
  - scroll-to: { target: { id: export-extra-csv }, direction: down }
  - await: { visible: { id: export-split } }
  - tap: { id: export-split }
  - tap: { id: export-extra-csv }
  - echo: One file per outing and extra CSV are on. Relaunch; expect Outings, split and CSV to persist (Share export now carries 2 files).
  - launch: com.bontecou.whereday.mapqa
  - await: { visible: { id: map-header-title }, timeout: 20000 }
  - await: { idle: true }
  - tap: { id: navigation-archive }
  - await: { visible: { id: export-history-count } }
  - await: { idle: true }
  - await: { visible: { text: Export my outings as JSON } }
  - tap: { id: export-share }
  - await: { visible: { id: 'com.android.intentresolver:id/headline' }, timeout: 15000 }
  - await: { text: { in: { id: 'com.android.intentresolver:id/headline' }, equals: Sharing 2 files } }
  - await: { text: { in: { id: 'com.android.intentresolver:id/content_preview_filename' }, contains: outings - Outing 1.json } }
  - tool: button
    args:
      button: back
  - await: { hidden: { id: 'com.android.intentresolver:id/headline' } }
  - echo: 'Restore every choice: turn off One file per outing and extra CSV, set Data back to All.'
  - scroll-to: { target: { id: export-advanced }, direction: down }
  - tap: { id: export-advanced }
  - scroll-to: { target: { id: export-extra-csv }, direction: down }
  - await: { visible: { id: export-split } }
  - tap: { id: export-split }
  - tap: { id: export-extra-csv }
  - scroll-to: { target: { id: export-history-count }, direction: up }
  - await: { visible: { text: 'Export my outings as JSON, all in one file.' } }
  - tap: { text: { matches: '^Outings$' } }
  - await: { visible: { text: { matches: '^Visits$' } } }
  - tap: { text: { matches: '^All$' } }
  - await: { visible: { text: 'Export my visits & points as JSON, all in one file.' } }
  - tap: { id: navigation-map }
  - await: { visible: { id: map-header-title } }
  - await: { idle: true }
