executionPrerequisite: Isolated com.bontecou.whereday.mapqa app is onboarded and idle, with no history
  or photo references. Only the three named generated photo-map fixture files are staged as described
  by photo-map-and-outing. Ends at the generated outing detail.
steps:
- await:
    visible:
      text: Start recording
- await:
    idle: true
- tap:
    id: navigation-archive
- await:
    visible:
      text: Import history file
- await:
    idle: true
- tap:
    text: Import history file
- await:
    visible:
      text: whereday-photo-map-qa-20261027.csv
- await:
    idle: true
- tap:
    text:
      matches: ^whereday-photo-map-qa-20261027\.csv
- await:
    visible:
      text: Import history file
- await:
    idle: true
- tap:
    text: Settings
- await:
    visible:
      text: Distance filter
- await:
    idle: true
- scroll-to:
    target:
      text: Photos
    direction: down
- await:
    visible:
      text: Photos
- await:
    idle: true
- tap:
    text: Photos
- await:
    visible:
      text: No photos selected yet.
- await:
    idle: true
- tap:
    text: Choose photo files
- await:
    visible:
      text: whereday-public-photo-qa-a.jpg
- await:
    idle: true
- tap:
    text:
      matches: ^whereday-public-photo-qa-a\.jpg
- await:
    visible:
      text: 1 saved photo reference
    timeout: 10000
- await:
    idle: true
- await:
    visible:
      text: Inferred from route
- await:
    idle: true
- tap:
    text: Choose photo files
- await:
    visible:
      text: whereday-public-photo-qa-b.jpg
- await:
    idle: true
- tap:
    text:
      matches: ^whereday-public-photo-qa-b\.jpg
- await:
    visible:
      text: 2 saved photo references
    timeout: 10000
- await:
    idle: true
- tap:
    id: navigation-map
- await:
    visible:
      text: Map layers
- await:
    idle: true
- tap:
    text: Map layers
- await:
    visible:
      identifier: map-layer-photos
- await:
    idle: true
- tap:
    text: Photo markers
- await:
    idle: true
- tap:
    text: Done map layers
- await:
    visible:
      text: Photos on map
- await:
    idle: true
- await:
    visible:
      text: 1 photo groups containing 2 photos
- await:
    idle: true
- scroll-to:
    target:
      text: Refresh matched photos
    within:
      id: journal-map-scroll-margin
    direction: down
- tap:
    text: Photos on map
- await:
    visible:
      text: Close map photos
- await:
    idle: true
- tap:
    text: Oct 27, 10:00
- await:
    visible:
      text: Photo 1 of 2
- await:
    idle: true
- await:
    visible:
      text: Inferred from route
- await:
    idle: true
- tap:
    text: Next photo
- await:
    visible:
      text: Photo 2 of 2
- await:
    idle: true
- await:
    visible:
      text: Oct 27, 10:05
- await:
    idle: true
- tool: button
  args:
    button: back
- await:
    visible:
      text: Photos on map
- await:
    idle: true
- tap:
    id: map-day-peek
- tap:
    id: map-open-timeline
- await:
    visible:
      text: "Oct 27, 10:00 \u2192 Oct 27, 10:11"
- await:
    idle: true
- tap:
    text: "Oct 27, 10:00 \u2192 Oct 27, 10:11"
- await:
    visible:
      text: Back to timeline
- await:
    idle: true
