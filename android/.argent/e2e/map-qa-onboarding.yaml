# Fresh isolated com.bontecou.whereday.mapqa app only (side effect: marks onboarding complete in that package).
# Walks all ten Page One steps without requesting location, notifications or photos; no recording and no
# owner-package data access.
requires:
  platform: android
steps:
- echo: Fresh isolated com.bontecou.whereday.mapqa app only. Walk the ten Page One onboarding steps without requesting
    location or notifications; no recording or owner-package data access.
- launch: com.bontecou.whereday.mapqa
- await:
    visible:
      id: onboarding-cover-dial
- await:
    idle: true
- run: onboarding-pages.yaml
