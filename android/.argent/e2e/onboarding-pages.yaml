# Fragment: completes Page One onboarding without permissions and opens the journal. Marks onboarding complete
# without requesting location, notifications or photos and without starting a recording. Prerequisite: the
# disposable mapQa app is on its first (cover) onboarding step. Never reset owner data to rerun this fragment.
requires:
  platform: android
executionPrerequisite: Disposable com.bontecou.whereday.mapqa is open on its first Page One onboarding step (onboarding-cover-dial visible), with location and notification permissions not granted.
steps:
- run: onboarding-page-one-walk.yaml
- scroll-to:
    target:
      id: onboarding-continue
- tap:
    id: onboarding-continue
- await:
    visible:
      id: map-header
- await:
    idle: true
