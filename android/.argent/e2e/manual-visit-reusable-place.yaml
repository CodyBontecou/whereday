steps:
- echo: Requires onboarded idle app, empty saved-place library and no visit named Codex reuse QA 20261027.
    Run after 01:00 and finish before local midnight. Creates only a synthetic 0,0 visit/place, selects
    250 m reuse, verifies persistence and independent deletion, then removes both fixtures. Never clear
    journal data.
- launch: com.bontecou.whereday
- await:
    visible:
      id: map-header
- await:
    idle: true
- tap:
    id: map-day-peek
- tap:
    id: map-open-timeline
- await:
    visible:
      text: Add past visit
- await:
    idle: true
- tap:
    text: Add past visit
- await:
    visible:
      text: Choose visit location
- await:
    idle: true
- type:
    into:
      text: Name
    text: Codex reuse QA 20261027
    submit: false
- await:
    visible:
      role: TextField
      text: Codex reuse QA 20261027
- tool: button
  args:
    button: back
- tap:
    text: Choose visit location
- await:
    visible:
      text: Drop pin at map center
- await:
    idle: true
- tap:
    text: Drop pin at map center
- tap:
    text: Use this location
- await:
    visible:
      text: Choose visit location
- await:
    idle: true
- scroll-to:
    target:
      text: Save visit as reusable place
    direction: down
    within:
      id: visit-editor-fields
- await:
    visible:
      text: Save visit as reusable place
- tap:
    text: Save visit as reusable place
- scroll-to:
    target:
      text: 150 m
    direction: down
    within:
      id: visit-editor-fields
- tap:
    text: 150 m
- await:
    visible:
      text: 250 m
- await:
    idle: true
- tap:
    text: 250 m
- await:
    visible:
      text: 'Create saved place: Codex reuse QA 20261027'
- tap:
    text:
      matches: ^Save$
- await:
    visible:
      text: Add past visit
- await:
    idle: true
- await:
    visible:
      text: Codex reuse QA 20261027
- launch: com.bontecou.whereday
- await:
    visible:
      id: map-header
- await:
    idle: true
- tap:
    id: map-day-peek
- tap:
    id: map-open-timeline
- await:
    visible:
      text: Codex reuse QA 20261027
- await:
    idle: true
- tap:
    text: Codex reuse QA 20261027
- await:
    visible:
      text: Edit visit
- await:
    idle: true
- scroll-to:
    target:
      text: Delete visit
    direction: down
    within:
      id: visit-editor-fields
- await:
    visible:
      text: Delete visit
- tap:
    text: Delete visit
- await:
    visible:
      text: Delete this visit?
- await:
    idle: true
- tap:
    text:
      matches: ^Delete$
- await:
    visible:
      text: Add past visit
- await:
    idle: true
- await:
    hidden:
      text: Codex reuse QA 20261027
- tap:
    text: Add past visit
- await:
    visible:
      text: Choose saved place
- await:
    idle: true
- tap:
    text: Choose saved place
- await:
    visible:
      text: Cancel saved-place selection
- await:
    idle: true
- await:
    visible:
      text: Codex reuse QA 20261027
- tap:
    text: Codex reuse QA 20261027
- await:
    visible:
      text: Choose visit location
- await:
    idle: true
- await:
    visible:
      role: TextField
      text: Codex reuse QA 20261027
- scroll-to:
    target:
      text: 'Using saved place: Codex reuse QA 20261027'
    direction: down
    within:
      id: visit-editor-fields
- await:
    visible:
      text: 'Using saved place: Codex reuse QA 20261027'
- await:
    hidden:
      text: Save visit as reusable place
- tap:
    text:
      matches: ^Cancel$
- await:
    visible:
      text: Discard visit changes?
- await:
    idle: true
- tap:
    text: Discard changes
- await:
    visible:
      text: Add past visit
- await:
    idle: true
- tap:
    id: navigation-archive
- tap:
    id: archive-settings
- await:
    visible:
      text: Location and notification permissions
- await:
    idle: true
- scroll-to:
    target:
      text: Manage saved places
    direction: down
- await:
    visible:
      text: Manage saved places
- tap:
    text: Manage saved places
- await:
    visible:
      text: Search saved places
- await:
    idle: true
- await:
    visible:
      text: 'Match radius: 250 m'
- await:
    visible:
      text: Codex reuse QA 20261027
- tap:
    text: Codex reuse QA 20261027
- await:
    visible:
      text: Edit saved place
- await:
    idle: true
- await:
    visible:
      role: TextField
      text: '250.0'
- tap:
    text: Delete saved place
- await:
    visible:
      text: Delete this saved place?
- await:
    idle: true
- tap:
    text: Delete place
- await:
    visible:
      text: Search saved places
- await:
    idle: true
- await:
    hidden:
      text: Codex reuse QA 20261027
- await:
    visible:
      text: No saved places yet. Add a place or import a CSV file.
