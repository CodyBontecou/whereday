steps:
  - launch: com.bontecou.whereday
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Your location journal
  - tap:
      text: Start recording
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Stop recording
  - echo: Lock the Pixel screen while the foreground recording service remains
      active.
  - tool: button
    args:
      button: power
  - tool: button
    args:
      button: power
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Stop recording
  - tap:
      text: Stop recording
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Start recording
