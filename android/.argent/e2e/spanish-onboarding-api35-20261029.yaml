# Requires a fresh, unonboarded disposable mapQa install with its app locale set to es (external setup, e.g.
# `adb shell cmd locale set-app-locales com.bontecou.whereday.mapqa --locales es`), location and notifications not
# granted. Side effect: marks onboarding complete in that package. Skips every permission request.
requires:
  platform: android
steps:
- launch: com.bontecou.whereday.mapqa
- await:
    visible:
      text: "Cada d\xEDa es una p\xE1gina."
- await:
    idle: true
- run: onboarding-page-one-walk.yaml
- await:
    visible:
      text: "Tu primera p\xE1gina se cierra esta noche."
- await:
    idle: true
- scroll-to:
    target:
      id: onboarding-continue
- assert:
    text:
      in:
        id: onboarding-continue
      contains: Abrir Whereday
- tap:
    id: onboarding-continue
- echo: The journal opens on the redesigned Spanish map home (the older "Tu diario de ubicaciones" home no longer exists).
- await:
    visible:
      id: map-header-title
- await:
    idle: true
- assert:
    text:
      in:
        id: map-header-title
      equals: Hoy
- await:
    visible:
      text: Mapa
- await:
    visible:
      text: Archivo
