steps:
  - launch: com.bontecou.whereday.mapqa
  - tool: await-ui-element
    args:
      selector:
        identifier: map-layers
      condition: visible
  - tap:
      id: map-layers
  - tool: await-ui-element
    args:
      selector:
        identifier: map-layers-content
      condition: visible
  - tap:
      text: Match roads
  - tool: await-ui-element
    args:
      selector:
        identifier: road-settings-screen
      condition: visible
  - tool: rotate
    args:
      orientation: LandscapeLeft
  - tool: await-ui-element
    args:
      selector:
        identifier: road-settings-screen
      condition: visible
      timeoutMs: 8000
