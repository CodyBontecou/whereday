steps:
- echo: Known-bug reproduction on onboarded mapQa, empty country history, open whereday
    fold API35 with guest Vulkan enabled, English November 7 2026. Checks normal Nov3-Nov6
    selection, then records the incorrect Nov6-only result after rotation. Does not
    save the stay.
- launch: com.bontecou.whereday.mapqa
- await:
    visible:
      identifier: map-add
- await:
    idle: true
- tap:
    id: navigation-settings
- await:
    visible:
      identifier: settings-screen
- await:
    idle: true
- scroll-to:
    target:
      text:
        matches: ^Country Days$
    direction: down
- await:
    visible:
      text: Country Days
- await:
    idle: true
- tap:
    text: Country Days
- await:
    visible:
      identifier: country-days-content
- await:
    idle: true
- tap:
    text: Add country stay
- await:
    visible:
      identifier: stay-editor-content
- await:
    idle: true
- tap:
    text:
      matches: ^3$
- tap:
    text:
      matches: ^6$
- scroll-to:
    target:
      id: stay-last
    direction: down
- await:
    text:
      in:
        identifier: stay-first
      contains: Nov 3, 2026
- await:
    idle: true
- await:
    text:
      in:
        identifier: stay-last
      contains: Nov 6, 2026
- await:
    idle: true
- scroll-to:
    target:
      id: stay-country
    direction: up
- tap:
    text:
      matches: ^3$
- tool: rotate
  args:
    orientation: LandscapeLeft
- await:
    visible:
      identifier: stay-editor-content
- await:
    idle: true
- tool: rotate
  args:
    orientation: Portrait
- await:
    visible:
      identifier: stay-country
- await:
    idle: true
- tap:
    text:
      matches: ^6$
- scroll-to:
    target:
      id: stay-last
    direction: down
- await:
    text:
      in:
        identifier: stay-first
      contains: Nov 6, 2026
- await:
    idle: true
- await:
    text:
      in:
        identifier: stay-last
      contains: Nov 6, 2026
- await:
    idle: true
- tool: button
  args:
    button: back
- await:
    visible:
      identifier: stay-discard-confirm
- await:
    idle: true
- tap:
    text: Discard changes
- await:
    text:
      in:
        identifier: country-summary-days
      contains: 0 days
- await:
    idle: true
