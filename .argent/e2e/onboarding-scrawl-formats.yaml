# Page One onboarding, export screen (step 9 of 10): the format chips swap the synthetic
# sample file. With only the "Remember my days" intent, Markdown is the default.
# Prerequisites: Whereday debug build on an iOS pool simulator (iPhone 18 Pro, portrait,
# default text size, English). No permission state needed.
# Side effects: none (chips only change the preview; nothing is saved).
#
# Coordinate exceptions: the chips carry ids (onboarding-format-csv, onboarding-format-json)
# but Argent's iOS runner tree only exposes an anonymous AXScrollArea there, so the taps keep
# their recorded points (chip frame centres on a 402x874 pt iPhone 18 Pro); each tap is
# followed by an accessibility-tree check of the preview file name.
version: 1
requires:
  platform: ios
steps:
  - launch:
      native: com.bontecou.isome
      ios:
        app: com.bontecou.isome
        args:
          - -hasCompletedOnboarding
          - NO
          - --onboarding-page=8
          - -onboardingIntents
          - days
          - -AppleLanguages
          - (en)
          - -AppleLocale
          - en_US
          - -webhook.enabled
          - NO
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Daily Track - 2026-11-23.md
      timeoutMs: 20000
  - await: { idle: true }
  - echo: "Export: tap the CSV chip at (0.587, 0.375); expect the CSV sample file."
  - tool: gesture-tap
    args: { x: 0.587, y: 0.375 }
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: visits-2026-11.csv
  - echo: "Export: tap the JSON chip at (0.773, 0.375); expect the JSON backup sample and
      the CSV file name gone."
  - tool: gesture-tap
    args: { x: 0.773, y: 0.375 }
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: whereday-backup.json
  - tool: await-ui-element
    args:
      condition: hidden
      selector:
        text: visits-2026-11.csv
