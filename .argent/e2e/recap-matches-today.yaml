# The evening recap counts the same places as Today (#170): on the synthetic seeded day the map's
# peek card and day sheet show 4 PLACES (Home's stretch from midnight, Valencia Street Stop,
# Client Lunch — The Grove, Ferry Building Errand), and the dial lists Home first. The pending
# recap's text is the evidence on the other side: with --log-recap-schedule (DEBUG) the app log
# (DiagnosticsLog.json in the app container) must read "Your day: 4 places and 12.6 km." after
# this run. The runner does not read that log; compare it by hand or in the PR evidence.
#
# Prerequisites: an iOS pool simulator (iPhone 18 Pro, portrait, default text size, English) with
# a Debug install whose notifications are already allowed (run settings-reminders first),
# otherwise the recap is not scheduled and nothing is logged. Not between 6 PM and the recap time
# on a day you also want a recap logged: opening the app then skips that evening's recap.
# Side effects (synthetic data only): --seed-screenshot-data replaces all data with the synthetic
# San Francisco screenshot day and sets hasCompletedOnboarding; the recap is set to Every evening
# with place names off (launch arguments, so they apply to this launch's defaults domain).
#
# Coordinate exception: the peek card ("Open the day so far") has no id, and the recorder derived
# `text: Map` for its tap, which would hit the Map tab; the tap keeps its recorded point (the
# card's frame centre on a 402x874 pt iPhone 18 Pro) and is followed by a tree check on the
# sheet's PLACES stat. The waits stay raw await-ui-element steps: Argent's iOS runner tree does
# not carry these SwiftUI labels.
version: 1
requires:
  platform: ios
steps:
  - echo: Launch the Debug build with the synthetic screenshot day and an evening recap; expect the map on Today.
  - launch:
      native: com.bontecou.isome
      ios:
        app: com.bontecou.isome
        args:
          - --seed-screenshot-data
          - --log-recap-schedule
          - -Notelet.LatestSeenAppVersion
          - "2.0"
          - -AppleLanguages
          - (en)
          - -AppleLocale
          - en_US
          - -usesMetricDistanceUnits
          - YES
          - -recapReminder.frequency
          - daily
          - -recapReminder.showPlaceNames
          - NO
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        identifier: main-tab-archive
      timeoutMs: 20000
  - await: { idle: true }
  - echo: "Map on Today: the peek card shows 12.6 km and 4 PLACES, and the dial
      lists Home, Valencia Street Stop, Client Lunch — The Grove and Ferry
      Building Errand. The app log (--log-recap-schedule) must show the same
      count and distance in the pending recap."
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: 4 PLACES
      timeoutMs: 10000
  - tool: await-ui-element
    args:
      condition: text
      selector:
        text: Replay the day
      expectedText: Home until
  - echo: "Peek card: tap Open the day so far at (0.5, 0.832); expect the day sheet
      with its PLACES stat at 4."
  - tool: gesture-tap
    args: { x: 0.5, y: 0.832 }
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: 4, PLACES
      timeoutMs: 10000
  - await: { idle: true }
  - tool: await-ui-element
    args:
      condition: text
      selector:
        text: "24-hour dial: Home until"
      expectedText: Ferry Building Errand
