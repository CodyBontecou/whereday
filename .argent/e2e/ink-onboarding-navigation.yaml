# Page One onboarding: forward and Back navigation across the first three screens.
# Prerequisites: Whereday debug build on an iOS pool simulator (iPhone 18 Pro, portrait,
# default text size, English). No permission state needed.
# Side effects: none (no permission is requested, nothing is saved; relaunching with
# -hasCompletedOnboarding NO shows onboarding again).
#
# Coordinate exceptions: SwiftUI controls carry ids (onboarding-next, onboarding-back),
# but Argent's iOS runner tree exposes them only as anonymous AXButton nodes, so taps keep
# their recorded points (accessibility frame centres on a 402x874 pt iPhone 18 Pro) and
# each is followed by an accessibility-tree check of the destination step id.
version: 1
requires:
  platform: ios
steps:
  - launch:
      native: com.bontecou.isome
      ios:
        app: com.bontecou.isome
        args:
          - -hasCompletedOnboarding
          - NO
          - --onboarding-page=0
          - -onboardingIntents
          - days
          - -AppleLanguages
          - (en)
          - -AppleLocale
          - en_US
          - -webhook.enabled
          - NO
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        identifier: onboarding-step-0
      timeoutMs: 20000
  - await: { idle: true }
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Start my journal
  - echo: "Cover: tap Start my journal (onboarding-next) at (0.5, 0.855); expect step 1."
  - tool: gesture-tap
    args: { x: 0.5, y: 0.855 }
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        identifier: onboarding-step-1
  - await: { idle: true }
  - echo: "Intent: tap Continue (onboarding-next) at (0.5, 0.912); expect step 2."
  - tool: gesture-tap
    args: { x: 0.5, y: 0.912 }
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        identifier: onboarding-step-2
  - await: { idle: true }
  - echo: "Scrub: tap the header Back (onboarding-back) at (0.127, 0.11); expect step 1."
  - tool: gesture-tap
    args: { x: 0.127, y: 0.11 }
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        identifier: onboarding-step-1
  - await: { idle: true }
  - echo: "Intent: tap Back again; expect the cover with its import link (no Back there)."
  - tool: gesture-tap
    args: { x: 0.127, y: 0.11 }
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        identifier: onboarding-import
  - await: { idle: true }
